version: 1
disable_existing_loggers: False
formatters:
  default:
    "()": data_discovery_ai.config.log_formatter.build_formatter
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  access:
    "()": data_discovery_ai.config.log_formatter.build_formatter
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
filters:
  # Adds request_id bound via data_discovery_ai.utils.log_context
  context:
    "()": data_discovery_ai.utils.log_context.ContextFilter
handlers:
  default:
    formatter: default
    filters:
      - context
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    filters:
      - context
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn.error:
    level: INFO
    handlers:
      - default
    propagate: no
  uvicorn.access:
    level: INFO
    handlers:
      - access
    propagate: no
root:
  level: DEBUG
  handlers:
    - default
  propagate: no
