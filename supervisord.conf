[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:app]
command=python -m data_discovery_ai.server
directory=/app
user=appuser
environment=HOME="/home/appuser",USER="appuser",APP_HOST="127.0.0.1",APP_PORT="9000"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:nginx]
command=/bin/bash -c "until nc -z localhost 9000; do echo 'Waiting for Python app...'; sleep 1; done; echo 'Python app ready! Starting Nginx.'; exec nginx -g 'daemon off;'"
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopsignal=QUIT
